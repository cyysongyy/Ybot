name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 提醒：這個 PR 改到檢查或規則檔
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA" HEAD | grep -E '^(tests/|\.github/|CLAUDE\.md$)' || true)
          if [ -n "$files" ]; then
            list=$(echo $files)
            echo "::warning title=改到檢查或規則檔，合併前請看一下::$list"
            { echo "### ⚠️ 改到檢查或規則檔"; echo "$files" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: node --test tests/*.test.js
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: playwright install --with-deps chromium
      - run: python tests/app_test.py
